<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <script th:src="@{/js/search.js}" type="text/javascript"></script>
</head>
<body>
<div class="container">
    <h2>키워드 맛집</h2>
    <p>한 달간의 검색량을 실시간으로 확인하세요!</p>
    <!--검색창-->
    <form method="GET" name="search_form">
        <input type="text" name="keyword" placeholder="ex)동탄맛집">
        <button type="button" id="searchBtn">검색</button>
    </form>
    <div id="resultBox" class="result-box">
        <h3 id="resTitle">검색 결과</h3>
        <div class="result-item">
            <span>PC 월간 검색량 : </span>
            <span id="resPc">-</span>
        </div>
        <div class="result-item">
            <span>모바일 월간 검색량 : </span>
            <span id="resMobile">-</span>
        </div>
        <div class="result-item">
            <span>총 검색량 : </span>
            <span id="resTotal">-</span>
        </div>
    </div>
</div>
</body>
</html>
